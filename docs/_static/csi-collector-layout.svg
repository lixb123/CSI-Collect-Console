<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CSI-Collect-Console interface layout</title>
  <desc id="desc">Raw data and Collection occupy equal-width panes above the Radar model pane. Activity is on its own row inside Collection.</desc>
  <rect width="1440" height="900" fill="#f4f6f8"/>
  <rect x="24" y="20" width="1392" height="54" rx="8" fill="#263238"/>
  <text x="48" y="55" fill="#ffffff" font-family="Arial, sans-serif" font-size="25" font-weight="700">ESP CSI Collection Tool</text>
  <text x="1080" y="55" fill="#d7e3ea" font-family="Arial, sans-serif" font-size="17">Raw data   ✓</text>
  <text x="1240" y="55" fill="#d7e3ea" font-family="Arial, sans-serif" font-size="17">Radar model   ✓</text>

  <rect x="24" y="96" width="684" height="440" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
  <rect x="732" y="96" width="684" height="440" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>
  <rect x="24" y="558" width="1392" height="318" rx="8" fill="#ffffff" stroke="#90a4ae" stroke-width="2"/>

  <text x="48" y="132" fill="#263238" font-family="Arial, sans-serif" font-size="25" font-weight="700">Raw data</text>
  <text x="756" y="132" fill="#263238" font-family="Arial, sans-serif" font-size="25" font-weight="700">Collection</text>
  <text x="48" y="594" fill="#263238" font-family="Arial, sans-serif" font-size="25" font-weight="700">Radar model</text>

  <rect x="48" y="154" width="636" height="66" rx="5" fill="#e8f1fb" stroke="#78909c"/>
  <text x="68" y="183" fill="#37474f" font-family="Arial, sans-serif" font-size="17">Serial port · SSID · password · trigger mode</text>
  <text x="68" y="207" fill="#607d8b" font-family="Arial, sans-serif" font-size="15">Refresh ports and connect without reflashing the receiver</text>
  <rect x="48" y="236" width="636" height="164" rx="5" fill="#101820" stroke="#455a64"/>
  <text x="68" y="270" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="700">CSI subcarrier amplitude</text>
  <path d="M70 356 C150 300, 220 370, 300 324 S460 350, 555 294 S630 330, 665 312" fill="none" stroke="#ef5350" stroke-width="4"/>
  <path d="M70 372 C150 338, 220 354, 300 348 S460 310, 555 344 S630 322, 665 350" fill="none" stroke="#66bb6a" stroke-width="4"/>
  <rect x="48" y="416" width="306" height="92" rx="5" fill="#101820" stroke="#455a64"/>
  <text x="68" y="452" fill="#ffffff" font-family="Arial, sans-serif" font-size="18">RSSI</text>
  <path d="M70 482 C140 454, 220 492, 330 466" fill="none" stroke="#ffffff" stroke-width="3"/>
  <rect x="378" y="416" width="306" height="92" rx="5" fill="#101820" stroke="#455a64"/>
  <text x="398" y="452" fill="#ffffff" font-family="Arial, sans-serif" font-size="18">Radio metadata</text>
  <text x="398" y="480" fill="#cfd8dc" font-family="Arial, sans-serif" font-size="15">MAC · RSSI · MCS · bandwidth · channel</text>

  <rect x="756" y="154" width="636" height="64" rx="5" fill="#eaf4ea" stroke="#78909c"/>
  <text x="776" y="182" fill="#37474f" font-family="Arial, sans-serif" font-size="17">Participant label · Location label · Receiver label</text>
  <text x="776" y="205" fill="#607d8b" font-family="Arial, sans-serif" font-size="15">Tx-Rx distance (m) is saved with the session metadata</text>
  <rect x="756" y="236" width="636" height="78" rx="5" fill="#fff8e1" stroke="#78909c"/>
  <text x="776" y="266" fill="#37474f" font-family="Arial, sans-serif" font-size="19" font-weight="700">Activity label</text>
  <text x="776" y="294" fill="#607d8b" font-family="Arial, sans-serif" font-size="15">The action selector occupies its own full row</text>
  <rect x="756" y="332" width="306" height="84" rx="5" fill="#f5f7f8" stroke="#b0bec5"/>
  <rect x="1086" y="332" width="306" height="84" rx="5" fill="#f5f7f8" stroke="#b0bec5"/>
  <text x="776" y="366" fill="#37474f" font-family="Arial, sans-serif" font-size="17">Wait · duration</text>
  <text x="1106" y="366" fill="#37474f" font-family="Arial, sans-serif" font-size="17">Trials · Start</text>
  <text x="776" y="396" fill="#607d8b" font-family="Arial, sans-serif" font-size="15">seconds</text>
  <text x="1106" y="396" fill="#607d8b" font-family="Arial, sans-serif" font-size="15">collection controls</text>
  <rect x="756" y="438" width="636" height="70" rx="5" fill="#e8f1fb" stroke="#78909c"/>
  <text x="776" y="480" fill="#37474f" font-family="Arial, sans-serif" font-size="17">Collection remains visible when Radar model is hidden</text>

  <rect x="48" y="616" width="650" height="222" rx="5" fill="#101820" stroke="#455a64"/>
  <rect x="742" y="616" width="650" height="222" rx="5" fill="#101820" stroke="#455a64"/>
  <text x="72" y="650" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Radar features</text>
  <text x="766" y="650" fill="#ffffff" font-family="Arial, sans-serif" font-size="19" font-weight="700">Statistics and state tables</text>
  <path d="M72 788 C180 702, 250 800, 360 736 S520 790, 674 704" fill="none" stroke="#42a5f5" stroke-width="4"/>
  <path d="M766 784 C880 742, 960 770, 1080 708 S1250 780, 1370 730" fill="none" stroke="#66bb6a" stroke-width="4"/>
  <text x="48" y="870" fill="#546e7a" font-family="Arial, sans-serif" font-size="15">Default layout: Raw data and Collection are equal width; the Radar model group hides together with its title.</text>
</svg>
